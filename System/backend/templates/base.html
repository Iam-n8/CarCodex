<!-- base.html -->

<!DOCTYPE html>
<html>

<head>

    <title>{{ page_title or "Maintain Hub" }}</title>

    <style>

        /* =====================================
           Global Styles
        ====================================== */

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        /* =====================================
           Header
        ====================================== */

        .header {
            background: #1f2937;
            padding: 20px;
            font-size: 28px;
            font-weight: bold;
        }

        /* =====================================
           Layout
        ====================================== */

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* =====================================
           Sidebar
        ====================================== */

        .sidebar {
            width: 250px;
            background: #1f2937;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 10px 0;
        }

        .sidebar a:hover {
            color: #60a5fa;
        }

        .nav-group {
            margin-left: 20px;
        }

        .nav-sublink {
            color: #d1d5db !important;
        }

        .nav-sublink:hover {
            color: #60a5fa !important;
        }
        
        /* =====================================
           Global Links
        ====================================== */

        a {
            color: #60a5fa;
        }

        a:visited {
            color: #f97316;
        }

        a:hover {
            color: #fb923c;
            text-decoration: underline;
        }

        .nav-link {
            color: #60a5fa;
            text-decoration: none;
        }

        .nav-link:visited {
            color: #f97316;
        }

        .nav-link:hover {
            color: #fb923c;
            text-decoration: underline;
        }

        .sidebar a:visited {
            color: white;
        }


        /* =====================================
           Content
        ====================================== */

        .content {
            flex: 1;
            padding: 30px;
        }

        /* =====================================
           Generic Card
        ====================================== */

        .card {
            background: #1f2937;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

    <!-- Header -->

    <div class="header">
        Maintain Hub
    </div>

    <!-- Layout -->

    <div class="container">

        <!-- Sidebar -->

        <div class="sidebar">

            <a href="/ui">
                🏠 Dashboard
            </a>

            <div class="nav-group">

            <a href="/vehicles-ui">
                    🚗 Vehicles
                </a>
<!--
                <a href="/vendors-ui" class="nav-sublink">
                    🏢 Vendors
                </a>
-->
            </div>

            <a href="/settings">
                ⚙️ Settings
            </a>

        </div>

        <!-- Page Content -->

        <div class="content">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</body>

</html>
