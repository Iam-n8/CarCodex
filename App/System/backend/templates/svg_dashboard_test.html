<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard SVG Test</title>
    <style>
        :root {
            --bg: #0b1220;
            --panel: #111827;
            --panel-2: #1f2937;
            --line: rgba(148, 163, 184, 0.25);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --amber: #fbbf24;
            --red: #ef4444;
            --green: #22c55e;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #111827 0%, var(--bg) 60%, #050b14 100%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            padding: 32px;
        }

        .page {
            max-width: 1280px;
            margin: 0 auto;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        .subtitle {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 0.04em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 18px 18px 12px;
            box-shadow: 0 18px 30px rgba(0,0,0,0.22);
        }

        .card h2 {
            margin: 0 0 12px;
            font-size: 18px;
            letter-spacing: 0.03em;
        }

        .artboard {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            border-radius: 12px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.7), rgba(2, 6, 23, 0.9));
            border: 1px solid rgba(148, 163, 184, 0.12);
            overflow: hidden;
            padding: 16px;
        }

        .artboard img {
            max-width: 100%;
            max-height: 420px;
            width: auto;
            height: auto;
            display: block;
            filter: drop-shadow(0 10px 18px rgba(0,0,0,0.28));
        }

        .tag {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(255,255,255,0.03);
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div class="page">
        <h1>Dashboard Instrument Preview</h1>
        <p class="subtitle">Test page for the imported SVG dashboard symbols.</p>

        <div class="grid">
            <div class="card">
                <h2>dashboard-instruments-2.svg</h2>
                <div class="artboard">
                    <img src="/svg/dashboard-instruments-2.svg" alt="Dashboard instrument panel" />
                </div>
                <span class="tag">Full gauge panel</span>
            </div>

            <div class="card">
                <h2>check_tires.svg</h2>
                <div class="artboard">
                    <img src="/svg/check_tires.svg" alt="Check tires warning symbol" />
                </div>
                <span class="tag">Tires warning symbol</span>
            </div>

            <div class="card" style="grid-column: 1 / -1; background: #071c2f; border-color: rgba(148,163,184,0.18);">
                <h2 style="color: #f3f4f6; font-size: 26px; margin-bottom: 18px;">Icon Set Preview</h2>
                <div class="artboard" style="min-height: 260px; background: #071c2f; border: none; padding: 18px;">
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 18px; width: 100%;">
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/check_engine.svg" alt="check engine" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Check Engine
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/battery.svg" alt="battery" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Battery
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/brake.svg" alt="brake" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Brake
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/tire_pressure.svg" alt="tire pressure" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Tire Pressure
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/oil.svg" alt="oil" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Oil
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/temperature.svg" alt="temperature" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Temperature
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/fuel.svg" alt="fuel" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Fuel
                        </div>
                        <div style="text-align:center; color:#f3f4f6; font-size:12px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;">
                            <img src="/svg/service.svg" alt="service" style="width:90px;height:90px;display:block;margin:0 auto 10px;" />
                            Service
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
