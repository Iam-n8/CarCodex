<!-- vehicle_maintenance.html -->
{% extends "base.html" %}

{% block content %}

<h1>
    {{ vehicle.nickname }}
    Maintenance History
</h1>

<p>
    <a href="/vehicle/{{ vehicle.id }}">
        ← Back To Vehicle
    </a>
</p>

<p>
    <a href="/vehicle/{{ vehicle.id }}/maintenance-add">
        + Add Maintenance Visit 
    </a>
</p>

{% for visit in visits %}

<div class="card">

    <p>
        <strong>Date:</strong>
        {{ visit.visit_date }}
    </p>

    <p>
        <strong>Vendor:</strong>
        {{ visit.vendor }}
    </p>

    <p>
        <strong>Mileage:</strong>
        {{ visit.mileage }}
    </p>

    <p>
     <a href="/maintenance-visit/{{ visit.id }}">
            View Visit
        </a>
    </p>

</div>

{% endfor %}

{% endblock %}
