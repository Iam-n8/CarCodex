<!-- maintenance_add_vehicle.html -->
{% extends "base.html" %}

{% block content %}

<h1>Add Maintenance Visit</h1>

<p>
    Vehicle:
    <strong>
        {{ vehicle.nickname }}
    </strong>
</p>
<a href="/vehicle/{{ vehicle.id }}" class="nav-link">
    ← Back To Vehicle
</a>

<!-- <form method="post" action="/vehicle/{{ vehicle.id }}/maintenance-add"> -->
<form
    method="post"
    action="/vehicle/{{ vehicle.id }}/maintenance-add"
    enctype="multipart/form-data">

    <label>Vendor</label>

    <select name="vendor_id">

        {% for vendor in vendors %}

        <option value="{{ vendor.id }}">
            {{ vendor.name }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <label>Date</label>

    <input
        type="date"
        name="visit_date"
        required
    >

    <br><br>

    <label>Mileage</label>

    <input
        type="number"
        name="mileage"
        required
    >

    <br><br>

    <label>Invoice Number</label>

    <input
        type="text"
        name="invoice_number"
    >

    <br><br>

    <label>Total Cost</label>

    <input
        type="number"
        step="0.01"
        name="total_cost"
    >

    <h3>Primary Service</h3>

    <select name="primary_reason">

        {% for service_type in service_types %}

            <option value="{{ service_type.name }}">
                {{ service_type.name }}
            </option>

        {% endfor %}

        <option value="Other">
            Other
        </option>

    </select>

    <p>
        <label>Other Service</label>
    </p>

    <input
        type="text"
        name="other_service"
    >    
    <label>
    Invoice / Receipt
    </label>

    <input
        type="file"
        name="document_file"
>

<br><br>
    <br><br>

    <button type="submit">

        Save Visit

    </button>

</form>

{% endblock %}
