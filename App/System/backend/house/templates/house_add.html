<!-- house_add.html -->
{% extends "base.html" %}

{% block content %}

<h1>Add House</h1>

<p>
    <a href="/house-ui" class="nav-link">
        ← Back to Houses
    </a>
</p>

<form id="houseForm" action="/house-add" method="post" class="house-form">
    <div class="form-section">
        <label>
            Street Address
            <input type="text" id="address" name="address" required>
        </label>

        <label>
            City
            <input type="text" id="city" name="city" required>
        </label>

        <label>
            State
            <input type="text" id="state" name="state" maxlength="2" required value="FL">
        </label>

        <label>
            ZIP Code
            <input type="text" id="zip_code" name="zip_code" required>
        </label>

        <button type="button" id="lookupBtn" class="lookup-btn">🔍 Lookup Property</button>
    </div>

    <div id="lookupStatus" class="lookup-status" style="display:none;"></div>

    <label>
        County
        <input type="text" id="county" name="county" required>
    </label>

    <label>
        Property Type
        <select name="property_type">
            <option value="Single Family">Single Family</option>
            <option value="Condo">Condo</option>
            <option value="Townhome">Townhome</option>
            <option value="Multi Family">Multi Family</option>
        </select>
    </label>

    <label>
        Bedrooms
        <input type="number" name="bedrooms" min="0">
    </label>

    <label>
        Bathrooms
        <input type="number" name="bathrooms" min="0" step="0.5">
    </label>

    <button type="submit">Save House</button>
</form>

<script>
    document.getElementById('lookupBtn').addEventListener('click', async function() {
        const address = document.getElementById('address').value;
        const city = document.getElementById('city').value;
        const state = document.getElementById('state').value;
        const zipCode = document.getElementById('zip_code').value;
        const statusDiv = document.getElementById('lookupStatus');

        if (!address || !city || !state || !zipCode) {
            statusDiv.textContent = '❌ Please fill in all address fields first';
            statusDiv.className = 'lookup-status error';
            statusDiv.style.display = 'block';
            return;
        }

        statusDiv.textContent = '⏳ Looking up property...';
        statusDiv.className = 'lookup-status info';
        statusDiv.style.display = 'block';

        const formData = new FormData();
        formData.append('address', address);
        formData.append('city', city);
        formData.append('state', state);
        formData.append('zip_code', zipCode);

        try {
            const response = await fetch('/house/lookup', {
                method: 'POST',
                body: formData,
            });

            const result = await response.json();

            if (result.success) {
                document.getElementById('county').value = result.parcel.county || city;
                statusDiv.textContent = '✅ Property found! County filled in.';
                statusDiv.className = 'lookup-status success';
            } else {
                document.getElementById('county').value = 'Sarasota';
                statusDiv.textContent = '⚠️ ' + result.parcel.message;
                statusDiv.className = 'lookup-status warning';
            }
        } catch (error) {
            statusDiv.textContent = '❌ Error: ' + error.message;
            statusDiv.className = 'lookup-status error';
        }
    });
</script>

<style>
    .house-form {
        display: grid;
        gap: 14px;
        max-width: 500px;
        background: #1f2937;
        padding: 20px;
        border-radius: 10px;
        border: 1px solid #374151;
    }

    .form-section {
        display: grid;
        gap: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid #374151;
    }

    .house-form label {
        display: grid;
        gap: 6px;
        font-weight: bold;
    }

    .house-form input,
    .house-form select,
    .house-form button {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #4b5563;
        font-size: 16px;
    }

    .house-form button {
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: bold;
    }

    .lookup-btn {
        background: #10b981 !important;
        padding: 12px !important;
        font-weight: bold;
    }

    .lookup-btn:hover {
        background: #059669 !important;
    }

    .lookup-status {
        padding: 12px;
        border-radius: 6px;
        margin: 0;
    }

    .lookup-status.success {
        background: #ecfdf5;
        border: 1px solid #10b981;
        color: #047857;
    }

    .lookup-status.warning {
        background: #fffbeb;
        border: 1px solid #f59e0b;
        color: #92400e;
    }

    .lookup-status.info {
        background: #eff6ff;
        border: 1px solid #3b82f6;
        color: #1e40af;
    }

    .lookup-status.error {
        background: #fef2f2;
        border: 1px solid #ef4444;
        color: #991b1b;
    }

    .nav-link {
        color: #60a5fa;
        text-decoration: none;
    }

    .nav-link:hover {
        text-decoration: underline;
    }
</style>

{% endblock %}
